[fedora-dev]
image=registry.fedoraproject.org/fedora:latest
init_hooks=sudo dnf install -y neovim git tmux ripgrep fd-find

[ubuntu-dev]
image=ubuntu:24.04
init_hooks=sudo apt update && sudo apt install -y neovim git tmux ripgrep fd-find

[arch-dev]
image=archlinux:latest
init_hooks=sudo pacman -Syu --noconfirm neovim git tmux ripgrep fd
